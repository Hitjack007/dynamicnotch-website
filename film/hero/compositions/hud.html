<template>
  <style>
    @font-face {
      font-family: 'Geist';
      src: url('assets/fonts/geist.woff2') format('woff2');
      font-weight: 100 900;
    }
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      font-family: 'Geist', sans-serif;
    }
    #hud-stage,
    #hud-cam {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
    }
    #hud-cam video {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 1080px;
      object-fit: cover;
    }
    /* One word slot: Volume rolls to Brightness when the HUD switches. */
    .slot {
      position: absolute;
      left: 192px;
      top: 730px;
      height: 160px;
      overflow: hidden;
      color: #fff;
      font-size: 150px;
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 160px;
      white-space: nowrap;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);
    }
    .slot div {
      height: 160px;
    }
  </style>
  <div id="root" data-composition-id="hud" data-width="1920" data-height="1080">
    <div id="hud-stage">
      <div id="hud-cam">
        <video id="hud-vid" class="clip" data-start="0" data-duration="3.35" data-media-start="0" src="assets/hud.mp4" muted playsinline></video>
      </div>
      <div id="hud-slot" class="clip slot" data-start="0.3" data-duration="3.05" data-layout-allow-overflow data-layout-allow-occlusion>
        <div id="hud-roll">
          <div>Volume</div>
          <div>Brightness</div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    tl.set('#hud-cam', { transformOrigin: '0 0', x: -370, y: 0, scale: 1.3 }, 0);

    // Arrives from the left with a horizontal smear, then holds.
    tl.fromTo('#hud-roll', { x: -70, opacity: 0, filter: 'blur(10px)' },
      { x: 0, opacity: 1, filter: 'blur(0px)', duration: 0.3, ease: 'expo.out' }, 0.3);

    // Roll to Brightness on the frame the HUD switches (src 42.35 s).
    tl.fromTo('#hud-roll', { y: 0 },
      { y: -160, duration: 0.14, ease: 'power3.inOut', immediateRender: false }, 1.6);
    tl.to('#hud-roll > div:first-child', { opacity: 0, duration: 0.1, ease: 'power3.in' }, 1.62);

    window.__timelines['hud'] = tl;
  </script>
</template>
